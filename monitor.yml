name: 楓幣幣值監控

on:
  schedule:
    - cron: "7,37 * * * *"   # 每小時的第7分和第37分執行 (UTC時間)，約每30分鐘一次；避開整點時段以降低被GitHub排程延遲/跳過的機率
  workflow_dispatch: {}    # 也可以手動在GitHub網站上按按鈕觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 執行監控腳本
        run: python maple_rate_monitor.py

      - name: 提交更新後的網頁與紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/rate_history.csv docs/completed_trades.json
          git diff --quiet --cached || git commit -m "自動更新幣值資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git merge -X ours origin/main --no-edit || true
          git push
